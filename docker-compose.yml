# docker-compose de FinSightAI — versión OCI (auto-hospedado)
# Levanta: frontend (nginx) + backend (Spring) + ai-service (FastAPI) + caddy (proxy + TLS).
# Postgres se agrega en la fase de migración de auth/DB (por ahora el backend usa la BD externa).
#
# Uso:
#   docker compose up -d --build
#
# Requisitos (cada uno con su .env, NO commiteado):
#   - Backend/backend/.env      → DB_PASS, SERVICE_TOKEN, RESEND_API_KEY, VAPID_*, ...
#   - AI-Service/.env           → GROQ_API_KEY (+2/3/4), GEMINI_API_KEY, SERVICE_TOKEN, ...
#   - frontend/.env             → VITE_VAPID_PUBLIC_KEY (para el build dev)
#   - frontend/.env.production   → VITE_API_URL=/api, VITE_AI_URL=/ai, VITE_VAPID_PUBLIC_KEY

services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    expose:
      - "80"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finsight
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-finsight_dev}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight -d finsight"]
      interval: 5s
      timeout: 5s
      retries: 12
    expose:
      - "5432"

  backend:
    build:
      context: ./Backend/backend
    env_file:
      - ./Backend/backend/.env
    environment:
      # Apuntamos el backend al Postgres propio (override de los defaults de Supabase).
      DB_URL: "jdbc:postgresql://postgres:5432/finsight"
      DB_USER: "finsight"
      DB_PASS: "${POSTGRES_PASSWORD:-finsight_dev}"
      # El microservicio de ML se alcanza por su nombre de servicio en la red de compose
      # (el default 127.0.0.1:8000 dentro del container apunta al propio backend).
      ML_SERVICE_URL: "http://ai-service:8000"
      # Object Storage para avatares. Sin overrides → MinIO local (dev).
      # En el VM: definir STORAGE_S3_* en el .env raíz (root) y toma OCI real.
      STORAGE_S3_ENDPOINT: "${STORAGE_S3_ENDPOINT:-http://minio:9000}"
      STORAGE_S3_ACCESS_KEY: "${STORAGE_S3_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}"
      STORAGE_S3_SECRET_KEY: "${STORAGE_S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}"
      STORAGE_S3_REGION: "${STORAGE_S3_REGION:-us-east-1}"
      STORAGE_AVATARS_BUCKET: "${STORAGE_AVATARS_BUCKET:-finsight-avatars}"
      STORAGE_AVATARS_PUBLIC_URL: "${STORAGE_AVATARS_PUBLIC_URL:-http://localhost:9000/finsight-avatars}"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    expose:
      - "8081"

  ai-service:
    build:
      context: ./AI-Service
    env_file:
      - ./AI-Service/.env
    environment:
      # Dentro de la red de compose, el backend se alcanza por su nombre de servicio.
      BACKEND_URL: "http://backend:8081/api"
      # Modelos desde Object Storage. Sin overrides → MinIO local (dev).
      # En el VM: definir MODELS_S3_* en el .env raíz (root) y toma OCI real.
      # Si el storage no responde, el AI-Service usa los .joblib empaquetados (fallback).
      MODELS_S3_ENDPOINT: "${MODELS_S3_ENDPOINT:-http://minio:9000}"
      MODELS_S3_BUCKET: "${MODELS_S3_BUCKET:-finsight-models}"
      MODELS_S3_ACCESS_KEY: "${MODELS_S3_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}"
      MODELS_S3_SECRET_KEY: "${MODELS_S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}"
      MODELS_S3_REGION: "${MODELS_S3_REGION:-us-east-1}"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    expose:
      - "8000"

  # Object Storage local (S3-compatible), stand-in del OCI Object Storage para dev/test.
  # En OCI se apunta a los endpoints reales; MinIO no se despliega en prod.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "9000:9000"   # API S3 (los avatares se sirven desde acá en local)
      - "9001:9001"   # consola web de MinIO
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Job de un solo tiro: crea los buckets, deja "avatars" con lectura pública y sube los
  # modelos empaquetados al bucket de modelos (para probar el flujo S3 sin OCI real).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./AI-Service/models:/models:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/finsight-models &&
      mc mb -p local/finsight-avatars &&
      mc anonymous set download local/finsight-avatars &&
      mc cp --recursive /models/ local/finsight-models/ &&
      echo 'Buckets listos y modelos subidos' || true
      "
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    restart: "no"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Local: http://localhost (sin TLS). Producción: seteá SITE_ADDRESS=tudominio.com (Caddy hace HTTPS solo).
      SITE_ADDRESS: "${SITE_ADDRESS:-http://localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - ai-service

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  minio_data:
