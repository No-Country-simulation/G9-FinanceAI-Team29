server:
  # Render/hosts inyectan el puerto en $PORT; local cae a 8081.
  port: ${PORT:8081}

spring:
  application:
    name: financeai-backend

#conexion local
#  datasource:
#    url: jdbc:postgresql://localhost:5432/financeai
#    username: postgres
#    password: postgres
#    driver-class-name: org.postgresql.Driver

  datasource:
    # Externalizado: en Render se setean DB_URL/DB_USER/DB_PASS como env vars (secrets).
    # Los defaults mantienen el arranque local sin configurar nada.
    url: ${DB_URL:jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
    username: ${DB_USER:postgres.wfypvyfhpworindwllsz}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    # Ejecuta data.sql DESPUÉS de que Hibernate cree las tablas
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      continue-on-error: false

# Microservicio de ML (FastAPI). Si está caído, el backend usa las reglas internas.
ml:
  service:
    enabled: ${ML_SERVICE_ENABLED:true}
    # En Render apunta a la URL pública del AI-Service (ML_SERVICE_URL). Local: 127.0.0.1:8000.
    url: ${ML_SERVICE_URL:http://127.0.0.1:8000}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    # Confianza mínima para aceptar la categoría del modelo; por debajo se usan las reglas.
    classification-confidence-threshold: 0.5

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.financeai: INFO
    org.hibernate.SQL: WARN

supabase:
  url: ${SUPABASE_URL:https://wfypvyfhpworindwllsz.supabase.co}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
