server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta del router (/signin, /transacciones, …) cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html NUNCA se cachea: siempre revalida contra el server para tomar el
    # bundle con hash más reciente. Sin esto, un deploy nuevo no llega al usuario
    # hasta que borra la caché a mano.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # Assets con hash de Vite (cambian de nombre en cada build) → cache largo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
