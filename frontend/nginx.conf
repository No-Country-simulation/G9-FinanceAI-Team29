server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta del router (/signin, /transacciones, …) cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash de Vite → cache largo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
